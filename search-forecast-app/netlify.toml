command = "npm ci && npm run build"[build]  base = "frontend"  publish = "dist"  command = "npm ci && npm run build"  functions = "../netlify/functions"[functions]  node_bundler = "esbuild"  included_files = ["../netlify/functions/utils/**"][[redirects]]  from = "/api/*"  to = "/.netlify/functions/:splat"  status = 200  force = true[build.environment]  NODE_VERSION = "18"  NPM_FLAGS = "--prefer-offline"